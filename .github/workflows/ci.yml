name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest and static (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: colosseum-messaging
      - uses: actions/checkout@v7
        with:
          repository: tps01/colosseum-core
          ref: develop
          path: colosseum-core
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        working-directory: colosseum-messaging
        run: |
          python -m pip install -U pip
          python -m pip install -e ../colosseum-core
          python -m pip install -r requirements.txt
      - name: Test
        working-directory: colosseum-messaging
        run: python -m pytest -q
      - name: Static
        working-directory: colosseum-messaging
        run: |
          ruff check .
          mypy
      - name: Build distribution
        if: matrix.python-version == '3.12'
        working-directory: colosseum-messaging
        run: |
          python -m pip install build
          python -m build
      - name: Smoke-test default wheel install
        if: matrix.python-version == '3.12'
        working-directory: colosseum-messaging
        run: |
          python -m venv .package-venv
          .package-venv/bin/pip install ../colosseum-core
          .package-venv/bin/pip install dist/*.whl
          .package-venv/bin/python -c "import colosseum_messaging, redis, zmq, paho.mqtt.client, paramiko, scp"

  # Confirm the API pages build. Publishing stays on the develop pages workflow.
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: colosseum-messaging
      - uses: actions/checkout@v7
        with:
          repository: tps01/colosseum-core
          ref: develop
          path: colosseum-core
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        working-directory: colosseum-messaging
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          python -m pip install -U pip
          python -m pip install "sphinx>=7.0,<9"
          python -m pip install -e ../colosseum-core
          python -m pip install -r requirements.txt
      - name: Build documentation
        working-directory: colosseum-messaging
        run: python scripts/build_pages.py
