[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colosseum-messaging"
version = "0.8.8"
description = "Colosseum messaging plugin (HTTP, Redis, ZMQ, MQTT, SSH, SCP)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "colosseum-core>=0.18,<0.19",
  "redis>=5,<6",
  "pyzmq>=27.2,<28",
  "paho-mqtt>=2,<3",
  "paramiko>=3.0,<4",
  "scp>=0.14,<1",
]

[project.entry-points."colosseum.plugins"]
messaging = "colosseum_messaging:register"

[tool.setuptools.packages.find]
include = ["colosseum_messaging*"]

[tool.setuptools.package-data]
colosseum_messaging = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["colosseum_messaging"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["A", "BLE", "FBT", "N", "COM", "C4", "C901", "ISC", "ICN", "TID", "TCH", "E", "F", "W", "I", "B", "UP", "ANN", "ARG", "SIM", "RET", "PTH", "PLR1702", "PLR0914", "PLR0915", "PLR0912"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG", "S101", "C901", "PLR0912", "PLR0914", "PLR0915", "PLR1702"]
"examples/**" = ["ANN", "ARG", "C901", "PLR0912", "PLR0914", "PLR0915", "PLR1702"]
"scripts/**" = ["C901", "PLR0912", "PLR0914", "PLR0915", "PLR1702"]
"colosseum_messaging/http/**" = ["A005"]
"colosseum_messaging/ssh/_background.py" = ["TC003"]
"colosseum_messaging/ssh/_sim.py" = ["TC003"]

[tool.mypy]
python_version = "3.12"
packages = ["colosseum_messaging"]
exclude = ["tests/", "build/", "examples/"]
mypy_path = [
  ".deps/colosseum-core",
  "../colosseum-core",
]
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["redis.*", "zmq.*", "paho.*", "paramiko.*", "scp.*", "pytest", "tomli"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "build", "examples", "docs"]
