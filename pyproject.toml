[build-system]requires = ["setuptools>=77", "wheel"]build-backend = "setuptools.build_meta"[project]name = "colosseum-messaging"version = "0.2.4"description = "Colosseum messaging plugin (HTTP, Redis, ZMQ, MQTT, SSH)"readme = "README.md"requires-python = ">=3.9"license = "MIT"license-files = ["LICENSE"]dependencies = [  "colosseum-core>=0.15,<0.16",  "redis>=5,<6",  "pyzmq>=26,<27",  "paho-mqtt>=2,<3",  "paramiko>=3.0,<4",  "pytest>=8.0",  "bandit[toml]>=1.7",  "vulture>=2.11",  "ruff>=0.8",  "mypy>=1.11",  "types-paramiko",][project.entry-points."colosseum.plugins"]messaging = "colosseum_messaging:register"[tool.setuptools.packages.find]include = ["colosseum_messaging*"][tool.setuptools.package-data]colosseum_messaging = ["py.typed"][tool.pytest.ini_options]testpaths = ["tests/unit", "tests/integration"][tool.ruff]target-version = "py39"line-length = 100src = ["colosseum_messaging"][tool.ruff.lint]select = ["E", "F", "W", "I", "B", "UP", "ANN", "ARG", "SIM", "RET", "PTH"][tool.ruff.lint.per-file-ignores]"tests/**" = ["ANN", "ARG"]"examples/**" = ["ANN", "ARG"][tool.mypy]python_version = "3.12"packages = ["colosseum_messaging"]exclude = ["tests/", "build/", "examples/"]mypy_path = [  ".deps/colosseum-core",  "../colosseum-core",]strict = truewarn_unused_ignores = trueshow_error_codes = true[[tool.mypy.overrides]]module = ["redis.*", "zmq.*", "paho.*", "paramiko.*", "pytest", "tomli"]ignore_missing_imports = true[tool.bandit]exclude_dirs = ["tests", "build", "examples", "docs"]