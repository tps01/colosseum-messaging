[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colosseum-messaging"
version = "0.3.0"
description = "Colosseum messaging plugin (HTTP, Redis, ZMQ, MQTT, SSH)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "colosseum-core>=0.16.1,<0.17",
  "redis>=5,<6",
  "pyzmq>=26,<27",
  "paho-mqtt>=2,<3",
  "paramiko>=3.0,<4",
  "scp>=0.14,<1",
  "pytest>=8.0",
  "bandit[toml]>=1.7",
  "vulture>=2.11",
  "ruff>=0.8",
  "mypy>=1.11",
  "types-paramiko",
]

[project.entry-points."colosseum.plugins"]
messaging = "colosseum_messaging:register"

[tool.setuptools.packages.find]
include = ["colosseum_messaging*"]

[tool.setuptools.package-data]
colosseum_messaging = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["colosseum_messaging"]

[tool.ruff.lint]
select = ["A", "BLE", "FBT", "N", "COM", "C4", "ISC", "ICN", "TID", "TCH", "E", "F", "W", "I", "B", "UP", "ANN", "ARG", "SIM", "RET", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG", "S101"]
"examples/**" = ["ANN", "ARG"]
"colosseum_messaging/http/**" = ["A005"]
"colosseum_messaging/ssh/_background.py" = ["TC003"]
"colosseum_messaging/ssh/_sim.py" = ["TC003"]

[tool.mypy]
python_version = "3.12"
packages = ["colosseum_messaging"]
exclude = ["tests/", "build/", "examples/"]
mypy_path = [
  ".deps/colosseum-core",
  "../colosseum-core",
]
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["redis.*", "zmq.*", "paho.*", "paramiko.*", "scp.*", "pytest", "tomli"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "build", "examples", "docs"]
